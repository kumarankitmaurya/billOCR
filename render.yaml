# Render Blueprint for the billOCR backend (FastAPI + Postgres book of record).
#
# API-only service — the frontend (billOCR-ui) is a separate static app,
# deployed separately (Vercel). The book of record lives in Neon Postgres,
# not on local disk, so this service is stateless and needs no persistent
# disk: uploads are read into memory and discarded, and workbooks are
# streamed from a buffer (see app/services/excel_export.py).
#
# Deploy: connect this repo in the Render dashboard and it detects this file
# automatically ("New +" -> "Blueprint"), or run `render blueprint launch`
# with the Render CLI. Every `sync: false` value below is left for you to
# fill in via the dashboard — none of them is ever committed here.

services:
  - type: web
    name: billocr-backend
    runtime: python
    # Free: 750 instance-hours/month, no persistent disk needed (this service
    # writes no files). The cost is a 30-60s cold start on the first request
    # after idle, plus a second or two for Neon to resume — acceptable for a
    # shop scanning a handful of bills a day. Note that adding local PII
    # redaction (HANDOVER.md M3) will need a paid plan for memory.
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # A real liveness probe, so /docs doesn't have to be reachable for the
    # platform's benefit (see app/main.py).
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # REQUIRED. Without it app/db.py raises at startup and the container
      # boot-loops. Use Neon's POOLED endpoint — the hostname containing
      # `-pooler` — which is PgBouncer in transaction mode. The direct
      # endpoint is for migrations only.
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # REQUIRED. Gates every endpoint (X-App-Password). Without it the
      # service returns 503 to everything rather than serving the book of
      # record publicly. Shop staff get this one — make it long and random.
      - key: APP_PASSWORD
        sync: false
      # Additionally unlocks base price in /search (X-Admin-Password). The
      # owner gets this one. Must differ from APP_PASSWORD, or every staff
      # member can see what the shop paid.
      - key: ADMIN_PASSWORD
        sync: false
      # Set this to your actual Vercel origin (e.g.
      # https://billocr-ui.vercel.app) before the first real bill goes in.
      # Left unset, app/config.py still falls back to "*", which lets any
      # site on the internet call this API and read the whole book.
      - key: CORS_ORIGINS
        sync: false
