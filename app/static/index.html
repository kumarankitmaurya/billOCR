<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bill OCR → Excel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="bg-glow"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">🧾</span>
      <span class="brand-name">Bill OCR</span>
    </div>
    <button id="settingsToggle" class="icon-btn" title="Settings">⚙️</button>
  </header>

  <!-- Collapsible settings panel: holds the Gemini API key, saved to localStorage -->
  <section id="settingsPanel" class="settings-panel hidden">
    <label for="apiKeyInput">Gemini API Key <span class="muted">(optional — leave blank to use Tesseract fallback)</span></label>
    <div class="settings-row">
      <input id="apiKeyInput" type="password" placeholder="Paste your Gemini API key" autocomplete="off" />
      <button id="saveKeyBtn" class="btn btn-secondary">Save</button>
    </div>
    <p class="hint">Stored only in your browser's localStorage. Get a key at Google AI Studio.</p>
  </section>

  <main class="container">
    <h1 class="title">Turn bill photos into <span class="accent">Excel</span></h1>
    <p class="subtitle">Upload one or more bill/invoice images. We'll extract every line item and hand you back a clean spreadsheet.</p>

    <!-- Drag-and-drop upload zone -->
    <div id="dropZone" class="drop-zone">
      <input id="fileInput" type="file" accept="image/*" multiple hidden />
      <div class="drop-zone-inner">
        <div class="upload-icon">📤</div>
        <p class="drop-text">Drag & drop bill images here</p>
        <p class="drop-subtext">or</p>
        <button id="browseBtn" class="btn btn-primary">Browse Files</button>
      </div>
    </div>

    <!-- Thumbnails of selected files -->
    <div id="previewGrid" class="preview-grid hidden"></div>

    <div id="actionsRow" class="actions-row hidden">
      <button id="extractBtn" class="btn btn-primary btn-lg">
        <span id="extractBtnText">Extract Data</span>
      </button>
      <button id="clearBtn" class="btn btn-ghost">Clear</button>
    </div>

    <!-- Loading state -->
    <div id="loadingState" class="loading-state hidden">
      <div class="spinner"></div>
      <p id="loadingText">Reading your bill…</p>
    </div>

    <!-- Extracted data preview table -->
    <section id="resultsSection" class="results-section hidden">
      <div class="results-header">
        <h2>Extracted Data</h2>
        <button id="downloadBtn" class="btn btn-primary">⬇ Download Excel</button>
      </div>
      <div id="billsContainer"></div>
    </section>
  </main>

  <!-- Toast notifications -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="/static/app.js"></script>
</body>
</html>
